<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    body, html {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden; background: transparent;
    }
    #canvas-bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
    }
    #app-content {
      position: relative;
      z-index: 1;
      color: white;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      padding: 20px;
      font-family: sans-serif;
    }
    .hidden { display: none !important; }
    button {
      background: #2563eb; color: white; border: none;
      padding: 10px 20px; border-radius: 5px; cursor: pointer;
    }
  </style>
</head>
<body>

  <canvas id="canvas-bg"></canvas>
  
  <div id="app-content">
    <button id="capture-btn">Align Background</button>
    <h1 id="text-element" class="hidden">My "Transparent" PWA</h1>
    <p id="sub-text" class="hidden">The tunnel loop is broken!</p>
  </div>

  <script>
    const btn = document.getElementById('capture-btn');
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    
    // Hidden video element just to process the stream
    const tempVideo = document.createElement('video');
    tempVideo.autoplay = true;
    tempVideo.muted = true;

    btn.addEventListener('click', async () => {
      // 1. Temporarily hide UI elements so they aren't screenshotted
      btn.classList.add('hidden');
      
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: { displaySurface: "monitor" },
          audio: false
        });
        
        tempVideo.srcObject = stream;
        
        // 2. Wait a split second for the feed to stabilize
        tempVideo.onloadedmetadata = () => {
          setTimeout(() => {
            // Set canvas size to match match window bounds
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Calculate coordinates to crop out the exact portion behind your PWA
            const windowX = window.screenX || window.screenLeft;
            const windowY = window.screenY || window.screenTop;
            
            // 3. Draw ONE frozen snapshot to the canvas background
            ctx.drawImage(
              tempVideo, 
              windowX, windowY, window.innerWidth, window.innerHeight, // Source crop
              0, 0, window.innerWidth, window.innerHeight // Destination position
            );
            
            // 4. Turn off the camera stream immediately to kill the loop
            stream.getTracks().forEach(track => track.stop());
            
            // 5. Bring your interface text back over the clean image
            document.getElementById('text-element').classList.remove('hidden');
            document.getElementById('sub-text').classList.remove('hidden');
          }, 300); // 300ms delay ensures window elements disappear before snapshot
        };
      } catch (err) {
        console.error(err);
        btn.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
