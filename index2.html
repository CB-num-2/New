<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    body, html {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden; background: #000;
    }
    /* Container that clips out the edges */
    #bg-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      z-index: -1;
    }
    /* Shift the video up and scale it to hide the green sharing pill */
    #fake-bg {
      position: absolute;
      top: -40px; /* Adjust this value if the green banner is still partially visible */
      left: 0;
      width: 100%;
      height: calc(100% + 40px); /* Extends the video to account for the top crop */
      object-fit: cover;
      pointer-events: none;
    }
    #content {
      position: relative;
      z-index: 1;
      color: white;
      padding: 20px;
      font-family: sans-serif;
    }
  </style>
</head>
<body>

  <div id="bg-container">
    <video id="fake-bg" autoplay playsinline muted></video>
  </div>

  <div id="content">
    <h1>Clean Tab Mirroring</h1>
    <p>The green browser sharing banner has been cropped out of view!</p>
  </div>

  <script>
    async function setupCleanMirror() {
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: { displaySurface: "browser" },
          audio: false
        });
        
        const video = document.getElementById('fake-bg');
        video.srcObject = stream;
      } catch (err) {
        console.error("Capture rejected:", err);
      }
    }
    
    window.addEventListener('DOMContentLoaded', setupCleanMirror);
  </script>
</body>
</html>
