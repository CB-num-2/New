<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Launch PWA</title>
    <!-- Pointing directly to your custom manifest -->
    <link rel="manifest" href="manifest.webjson">
</head>
<body>
    <h1>Offline Fixed PWA</h1>
    <p>This window launches at 800x600 and respects your manifest settings.</p>

    <script>
        const TARGET_WIDTH = 800;
        const TARGET_HEIGHT = 600;

        // Snaps window layout if running as an installed app
        if (window.matchMedia('(display-mode: standalone)').matches) {
            window.resizeTo(TARGET_WIDTH, TARGET_HEIGHT);

            // Resizes back if a user tries to alter the dimensions
            window.addEventListener('resize', () => {
                if (window.innerWidth !== TARGET_WIDTH || window.innerHeight !== TARGET_HEIGHT) {
                    window.resizeTo(TARGET_WIDTH, TARGET_HEIGHT);
                }
            });
        }
    </script>
</body>
</html>
